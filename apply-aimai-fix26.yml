      - name: Check protected files are untouched
        run: |
          if git diff --name-only | grep -E 'LicenseActivity\.java|LicenseManager\.java|AndroidManifest\.xml'; then
            echo "A protected file changed, stopping."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Ask the server password when the app opens"
          git push

      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref aimai-final-redesign
