name: Apply AimAi Max launch-password and small button

# Runs once when this file is uploaded. Two changes in one run:
#  1) The floating button becomes a small rounded square (same as fix9).
#  2) The licence key is now asked for when Launch is tapped, not when the app opens.
#     LicenseActivity.java and LicenseManager.java are NOT changed.

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix10.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
          fetch-depth: 0

      - name: Patch the floating button
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gunzip > /tmp/patch_bubble.py
          python3 /tmp/patch_bubble.py

      - name: Move the licence check to the Launch button
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gunzip > /tmp/patch_mainactivity.py
          python3 /tmp/patch_mainactivity.py

      - name: Check protected files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/java/com/aimai/max/LicenseActivity.java app/src/main/java/com/aimai/max/LicenseManager.java app/src/main/AndroidManifest.xml

      - name: Commit and start the APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aimai/max/assistant/AssistantOverlayService.java app/src/main/java/com/aimai/max/MainActivity.java
          if git diff --cached --quiet; then
            echo "Files already up to date."
          else
            git commit -m "Small rounded-square button; licence check moved to the Launch button"
            git push origin aimai-final-redesign
          fi
          gh workflow run build-apk.yml --ref aimai-final-redesign
