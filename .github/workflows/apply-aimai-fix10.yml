name: Apply AimAi Max automation menu

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix10.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
