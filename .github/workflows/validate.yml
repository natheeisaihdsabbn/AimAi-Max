name: Validate AimAi Max

on:
  push:
    branches:
      - reference-ui-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Compile debug sources
        run: gradle :app:compileDebugJavaWithJavac

      - name: Run unit tests
        run: gradle testDebugUnitTest
