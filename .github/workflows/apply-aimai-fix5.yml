name: Apply AimAi Max simulation search

# Runs once when this file is uploaded (or by hand from the Actions tab).
# It writes the new scanner, physics simulation and shot search, patches the overlay
# in place (so your other changes stay), commits to this branch and starts the APK build.

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix5.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
          fetch-depth: 0

      - name: Write files and patch the overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java'
          echo '2f50e77cbab45eea2a395229fcdc7360115867411fe0259417abb803282d3b84  app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java'
          echo '2eefa816059ea3413c612a48f094779a2dcc4704a37aebdef46439ec9325fdad  app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/CarromSim.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/CarromSim.java'
          echo 'b09add3bedccc597082e74cccdfcc00c4f58796d323f7bbb14a464def8b302f6  app/src/main/java/com/aimai/max/assistant/CarromSim.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ShotSearch.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ShotSearch.java'
          echo '21795cf5c6be00951fe491b4875db86e3dc3222853bef79d02a9aa0f0d1bdddf  app/src/main/java/com/aimai/max/assistant/ShotSearch.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ScanPipeline.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ScanPipeline.java'
          echo 'be809ea2f98eecb3459ea78d9c1c448afa03229ecd92eaf18b0bb16dda78fb2e  app/src/main/java/com/aimai/max/assistant/ScanPipeline.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/AimGuideView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/AimGuideView.java'
          echo '5d02c308f47107560d1ca93135f8b933b90c2b18fcc66dd478833e3dacc6f1dc  app/src/main/java/com/aimai/max/assistant/AimGuideView.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java'
          echo 'c9951ce9b9ee6ea415ac5997cc21df6abddf94323e23aee64795816a70a52a48  app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java' | sha256sum -c -
          printf '%s' '' | base64 -d | gunzip > /tmp/patch_overlay.py
          python3 /tmp/patch_overlay.py

      - name: Check protected files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/java/com/aimai/max/LicenseActivity.java app/src/main/java/com/aimai/max/LicenseManager.java app/src/main/AndroidManifest.xml

      - name: Commit and start the APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aimai/max/assistant
          if git diff --cached --quiet; then
            echo "Files already up to date."
          else
            git commit -m "Simulation shot search: every coin, bank shots, one-second decisions, visible paths"
            git push origin aimai-final-redesign
          fi
          gh workflow run build-apk.yml --ref aimai-final-redesign
