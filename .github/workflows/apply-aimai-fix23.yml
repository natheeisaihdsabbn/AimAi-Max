          base64 -d /tmp/p.b64 | gunzip > /tmp/p.py
          python3 /tmp/p.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto Play works with drawings off, striker slides only when clearly better, bigger foul margin"
