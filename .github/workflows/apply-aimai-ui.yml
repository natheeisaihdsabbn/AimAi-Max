name: Apply AimAi Max UI update

# Runs once when this file is uploaded (or by hand from the Actions tab).
# It writes the new video-style UI files, commits them to this branch,
# and starts the APK build.

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-ui.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
          fetch-depth: 0

      - name: Write the five UI files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/MainActivity.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/MainActivity.java'
          echo '6171075cf0f0b9b503b88b46579071c3a725777833dbce973b38f616131169d3  app/src/main/java/com/aimai/max/MainActivity.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/ui/IconView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/ui/IconView.java'
          echo 'a0aaf2965338ea3382f5e265b6dd598a43f3df053ef3cdbacadfa17ea52a85d6  app/src/main/java/com/aimai/max/ui/IconView.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/ui/BoardIconView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/ui/BoardIconView.java'
          echo '6855722a6e7cd033ee2b336837eaf9eb95e22e034bb18d3a3729b03270b6687c  app/src/main/java/com/aimai/max/ui/BoardIconView.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/ui/BannerView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/ui/BannerView.java'
          echo '79b3aa9a0d3cfa30bab5b031f2b3d0512c7ae16482dcfe4da67ef5ac8154d1c5  app/src/main/java/com/aimai/max/ui/BannerView.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/ui/StylePreviewView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/ui/StylePreviewView.java'
          echo 'bb89c835831b441441d4753052e10afc637a2ac127717c090df4151a9881c666  app/src/main/java/com/aimai/max/ui/StylePreviewView.java' | sha256sum -c -

      - name: Check protected files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/java/com/aimai/max/LicenseActivity.java app/src/main/java/com/aimai/max/LicenseManager.java app/src/main/AndroidManifest.xml

      - name: Commit and start the APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aimai/max/MainActivity.java app/src/main/java/com/aimai/max/ui
          if git diff --cached --quiet; then
            echo "Files already up to date."
          else
            git commit -m "Apply AimAi Max video-style UI"
            git push origin aimai-final-redesign
          fi
          gh workflow run build-apk.yml --ref aimai-final-redesign
