name: Apply AimAi Max no-permission scan fix

# Runs once when this file is uploaded (or by hand from the Actions tab).
# It writes the fixed files, commits them to this branch and starts the APK build.

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
          fetch-depth: 0

      - name: Write the fixed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java'
          echo 'bf6d7d4d6d3850be06042d8e6cf8e85afea0267ac7f04f7c91d35c141f4a918f  app/src/main/java/com/aimai/max/assistant/CarromBoardAnalyzer.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java'
          echo 'ba80f7a87c01b94e6d49afdfa90a25e4e199236224b852524a977c5204197528  app/src/main/java/com/aimai/max/assistant/CarromShotPlanner.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ScanPipeline.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ScanPipeline.java'
          echo '186edf9c0e3c5c32455b27dbdef50959c42f00dbbd6598396234dfb3c4ebe535  app/src/main/java/com/aimai/max/assistant/ScanPipeline.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/AimAiGestureService.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/AimAiGestureService.java'
          echo 'd3bc69559b88d9c5b35b9bb7d1d1c29b074dadf5c5be4667f4c18c1fad374279  app/src/main/java/com/aimai/max/assistant/AimAiGestureService.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/AimGuideView.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/AimGuideView.java'
          echo '8eeee4b30e9a7ce57dc258f10f20455d5149076b9528fd5bf50dc6d2bafa67a1  app/src/main/java/com/aimai/max/assistant/AimGuideView.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java'
          echo '59bf6ab25f7f9388f04e15bcbde07d53e7d91bea5a7ca7f207924d3920413933  app/src/main/java/com/aimai/max/assistant/ScreenCaptureService.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/AssistantOverlayService.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/AssistantOverlayService.java'
          echo '5e9d905ea19d61ad51a4378a311d4ae9e09c8b2df68074b71743b43c685d1fdb  app/src/main/java/com/aimai/max/assistant/AssistantOverlayService.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/MainActivity.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/MainActivity.java'
          echo '44f25b74b89c2c52bafb9738f79b3748028c4eabf07a47751513b921f65e3014  app/src/main/java/com/aimai/max/MainActivity.java' | sha256sum -c -
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/res/xml/accessibility_service_config.xml'
          echo '38748cf9a26b112d6297a7a68847e77d2a698a8f5ee24c659b17e3266ab3276b  app/src/main/res/xml/accessibility_service_config.xml' | sha256sum -c -

      - name: Check protected files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/java/com/aimai/max/LicenseActivity.java app/src/main/java/com/aimai/max/LicenseManager.java app/src/main/AndroidManifest.xml

      - name: Commit and start the APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aimai/max/assistant app/src/main/java/com/aimai/max/MainActivity.java app/src/main/res/xml/accessibility_service_config.xml
          if git diff --cached --quiet; then
            echo "Files already up to date."
          else
            git commit -m "No screen-recording popup, drag-forward shots, power control, any-colour coins"
            git push origin aimai-final-redesign
          fi
          gh workflow run build-apk.yml --ref aimai-final-redesign
