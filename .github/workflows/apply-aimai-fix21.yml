              assert found == times, "pipeline: anchor found " + str(found) + " times (need " + str(times) + "), nothing changed: " + old[:80]

          # all anchors are there: now change
          ov = ov[:a] + chip_methods + ov[b:]
          i = ov.find(s_start)
          j = ov.find(s_end)
          ov = ov[:i] + ov[j:]
          for old, new, times in ov_pairs:
              ov = ov.replace(old, new)
          for old, new, times in sp_pairs:
              sp = sp.replace(old, new)
          open(ov_path, "w", encoding="utf-8").write(ov)
          open(sp_path, "w", encoding="utf-8").write(sp)
          print("edited overlay and pipeline")
          PYEND

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Joined floating buttons, lines only on my turn, swipe buttons removed"
          git push

      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref aimai-final-redesign
