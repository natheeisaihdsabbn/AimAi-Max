name: Apply AimAi Max deep-pocket accuracy fix

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix21*'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
      - name: Verify the actual source fixes
        run: |
          set -euo pipefail
          grep -Fq 'strikerPotR2' app/src/main/java/com/aimai/max/assistant/CarromSim.java
          grep -Fq 'boolean inMouth = false' app/src/main/java/com/aimai/max/assistant/CarromSim.java
          grep -Fq '2500f * r.otherPotted' app/src/main/java/com/aimai/max/assistant/ShotSearch.java
          grep -Fq 'r.otherPotted == 0' app/src/main/java/com/aimai/max/assistant/ShotSearch.java
          grep -Fq 'boolean iAmBlack = mineLum < oppLum' app/src/main/java/com/aimai/max/assistant/ScanPipeline.java
          echo 'All deep-pocket accuracy source checks passed.'
      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref aimai-final-redesign
