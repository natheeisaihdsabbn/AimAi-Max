name: Apply AimAi Max no-foul and slide fix

# Runs once when this file is uploaded. Two fixes in one run:
#  1) ShotSearch.java: a shot that pots the striker (foul) is never chosen, even as a fallback.
#  2) AssistantOverlayService.java: the striker now slides to a better spot on the baseline
#     much more readily, instead of almost always staying in the same place.

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix7.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign
          fetch-depth: 0

      - name: Write ShotSearch.java and patch the slide condition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/aimai/max/assistant/ShotSearch.java')"
          printf '%s' '' | base64 -d | gunzip > 'app/src/main/java/com/aimai/max/assistant/ShotSearch.java'
          echo '1d1c6d71431dd8b5b8fa3c4dfeea52adf292225737e45f0b9837efd3912c7e9b  app/src/main/java/com/aimai/max/assistant/ShotSearch.java' | sha256sum -c -
          printf '%s' '' | base64 -d | gunzip > /tmp/patch_slide.py
          python3 /tmp/patch_slide.py

      - name: Check protected files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/src/main/java/com/aimai/max/LicenseActivity.java app/src/main/java/com/aimai/max/LicenseManager.java app/src/main/AndroidManifest.xml

      - name: Commit and start the APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aimai/max/assistant/ShotSearch.java app/src/main/java/com/aimai/max/assistant/AssistantOverlayService.java
          if git diff --cached --quiet; then
            echo "Files already up to date."
          else
            git commit -m "Never foul by potting the striker; slide the striker much more readily"
            git push origin aimai-final-redesign
          fi
          gh workflow run build-apk.yml --ref aimai-final-redesign
