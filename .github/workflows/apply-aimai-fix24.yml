name: Apply AimAi Max steady shot choice and robust coin colour

on:
  push:
    branches:
      - aimai-final-redesign
    paths:
      - '.github/workflows/apply-aimai-fix24*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: aimai-final-redesign

