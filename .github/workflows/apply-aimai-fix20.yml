          # check every anchor first; change nothing if one is missing
          for key, pairs in plans.items():
              for old, new, times in pairs:
                  found = texts[key].count(old)
                  assert found == times, key + ": anchor found " + str(found) + " times (need " + str(times) + "), nothing changed: " + old[:80]
          for key, pairs in plans.items():
              src = texts[key]
              for old, new, times in pairs:
                  src = src.replace(old, new)
              open(files[key], "w", encoding="utf-8").write(src)
              print("edited", key)
